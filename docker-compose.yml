services:
  db:
    image: postgres:16-alpine
    container_name: consultorio-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: Consultorio
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Consultorio"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - consultorio-net

  redis:
    image: redis:7-alpine
    container_name: consultorio-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - consultorio-net

  app:
    build:
      context: .
      dockerfile: Consultorio.Server/Dockerfile
    container_name: consultorio-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ConsultorioConection=Host=db;Port=5432;Database=Consultorio;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres123}
      - ConnectionStrings__IdentityConection=Host=db;Port=5432;Database=Identity;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres123}
      - Redis__ConnectionString=redis:6379
      - Redis__Enabled=true
      - Migration__RunMigration=true
      - JwtOptions__Issuer=http://localhost
      - JwtOptions__Audience=Audience
      - JwtOptions__SecurityKey=A494384E-8732-434C-AC6A-1D0E3396B981-A494384E-8732-434C-AC6A-1D0E3396B981
      - Clinica__Nome=${CLINICA_NOME:-Consultório}
      - Clinica__UrlPublica=${CLINICA_URL_PUBLICA:-http://localhost:8080}
      - Clinica__Telefone=${CLINICA_TELEFONE:-}
      - Clinica__Endereco=${CLINICA_ENDERECO:-}
      - Notificacoes__Email__Host=${SMTP_HOST:-}
      - Notificacoes__Email__Porta=${SMTP_PORTA:-587}
      - Notificacoes__Email__Usuario=${SMTP_USUARIO:-}
      - Notificacoes__Email__Senha=${SMTP_SENHA:-}
      - Notificacoes__Email__Remetente=${SMTP_REMETENTE:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - consultorio-net

  # Backup diário (pg_dump) dos bancos Consultorio e Identity, salvo em ./backups no servidor.
  # Restauração: veja a seção "Backup e restauração" do README.
  backup:
    image: postgres:16-alpine
    container_name: consultorio-backup
    restart: always
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      BACKUP_HORA_UTC: ${BACKUP_HORA_UTC:-5}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
    volumes:
      - ./scripts/backup/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_PASTA:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - consultorio-net

volumes:
  postgres_data:
  redis_data:

networks:
  consultorio-net:
    driver: bridge
