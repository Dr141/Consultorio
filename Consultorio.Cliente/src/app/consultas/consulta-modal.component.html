<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ consulta ? 'Observações da Consulta' : 'Nova Consulta Médica' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="fechar()">
        <ion-icon slot="start" name="close-outline"></ion-icon>
        Fechar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <ion-grid class="ion-no-padding">
      <ion-row>
        @if (!consulta) {
          <ion-col size="12" size-sm="6">
            <ion-item class="form-item">
              <ion-select label="Paciente" labelPlacement="floating" formControlName="idPaciente" placeholder="Selecione o paciente">
                @for (p of pacientes; track p.id) {
                  <ion-select-option [value]="p.id">{{ p.nome }}</ion-select-option>
                }
              </ion-select>
            </ion-item>
          </ion-col>

          <ion-col size="12" size-sm="6">
            <ion-item class="form-item">
              <ion-select label="Médico Responsável" labelPlacement="floating" formControlName="idMedico" placeholder="Selecione o médico">
                @for (m of medicos; track m.id) {
                  <ion-select-option [value]="m.id">{{ m.nome }} ({{ m.crm }})</ion-select-option>
                }
              </ion-select>
            </ion-item>
          </ion-col>
        }

        <ion-col size="12">
          <ion-item class="form-item">
            <ion-textarea label="Prontuário / Evolução Médica / Observações"
                          labelPlacement="floating"
                          formControlName="observacao"
                          rows="6"
                          placeholder="Descreva sintomas, histórico, diagnósticos ou condutas prescritas...">
            </ion-textarea>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="ion-padding-top">
      <ion-button expand="block" type="submit" color="primary" [disabled]="form.invalid || salvando">
        <ion-icon slot="start" [name]="salvando ? 'hourglass-outline' : 'save-outline'"></ion-icon>
        {{ salvando ? 'Salvando...' : 'Salvar Consulta' }}
      </ion-button>
    </div>
  </form>
</ion-content>
