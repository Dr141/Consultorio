<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ exame ? 'Resultado / Editar Exame' : 'Solicitar Exame' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="fechar()">
        <ion-icon slot="start" name="close-outline"></ion-icon>
        Fechar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <ion-grid class="ion-no-padding">
      <ion-row>
        @if (!exame) {
          <ion-col size="12">
            <ion-item class="form-item">
              <ion-select label="Paciente" labelPlacement="floating" formControlName="idPaciente" placeholder="Selecione o paciente">
                @for (p of pacientes; track p.id) {
                  <ion-select-option [value]="p.id">{{ p.nome }}</ion-select-option>
                }
              </ion-select>
            </ion-item>
          </ion-col>

          <ion-col size="12">
            <ion-item class="form-item">
              <ion-input label="Descrição do Exame" labelPlacement="floating" formControlName="descricao" placeholder="Ex: Hemograma Completo, ECG, Raio-X"></ion-input>
            </ion-item>
          </ion-col>
        } @else {
          <ion-col size="12">
            <div class="exame-info-card">
              <h3><strong>Exame:</strong> {{ exame.descricao }}</h3>
              <p><strong>Paciente:</strong> {{ exame.nomePaciente }}</p>
            </div>
          </ion-col>
        }

        <ion-col size="12">
          <ion-item class="form-item">
            <ion-textarea label="Resultado do Exame / Laudo Médico"
                          labelPlacement="floating"
                          formControlName="resultado"
                          rows="5"
                          placeholder="Insira o laudo, valores de referência ou conclusões do exame...">
            </ion-textarea>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="ion-padding-top">
      <ion-button expand="block" type="submit" color="primary" [disabled]="form.invalid || salvando">
        <ion-icon slot="start" [name]="salvando ? 'hourglass-outline' : 'save-outline'"></ion-icon>
        {{ salvando ? 'Salvando...' : 'Salvar Exame' }}
      </ion-button>
    </div>
  </form>
</ion-content>
