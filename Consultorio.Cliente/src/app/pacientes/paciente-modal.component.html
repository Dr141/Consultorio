<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ paciente ? 'Editar Paciente' : 'Novo Paciente' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="fechar()">
        <ion-icon slot="start" name="close-outline"></ion-icon>
        Fechar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="12">
          <ion-item class="form-item">
            <ion-input label="Nome Completo" labelPlacement="floating" formControlName="nome" placeholder="Digite o nome completo"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12" size-sm="6">
          <ion-item class="form-item">
            <ion-input label="CPF" labelPlacement="floating" formControlName="cpf" placeholder="000.000.000-00"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12" size-sm="6">
          <ion-item class="form-item">
            <ion-input type="date" label="Data de Nascimento" labelPlacement="floating" formControlName="dtNasc"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <ion-item class="form-item">
            <ion-input label="Telefone" labelPlacement="floating" formControlName="telefone" placeholder="(00) 00000-0000"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <ion-item class="form-item">
            <ion-textarea label="Observações / Histórico Clínico" labelPlacement="floating" formControlName="observacao" rows="3" placeholder="Informações clínicas relevantes..."></ion-textarea>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="ion-padding-top">
      <ion-button expand="block" type="submit" color="primary" [disabled]="form.invalid || salvando">
        <ion-icon slot="start" [name]="salvando ? 'hourglass-outline' : 'save-outline'"></ion-icon>
        {{ salvando ? 'Salvando...' : 'Salvar Paciente' }}
      </ion-button>
    </div>
  </form>
</ion-content>
