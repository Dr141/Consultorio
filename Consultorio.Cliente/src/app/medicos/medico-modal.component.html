<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{ medico ? 'Editar Médico' : 'Novo Médico' }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="fechar()">
        <ion-icon slot="start" name="close-outline"></ion-icon>
        Fechar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="salvar()">
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="12">
          <ion-item class="form-item">
            <ion-input label="Nome Completo" labelPlacement="floating" formControlName="nome" placeholder="Dr. Nome Sobrenome"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12" size-sm="6">
          <ion-item class="form-item">
            <ion-input label="CPF" labelPlacement="floating" formControlName="cpf" placeholder="000.000.000-00"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12" size-sm="6">
          <ion-item class="form-item">
            <ion-input label="CRM" labelPlacement="floating" formControlName="crm" placeholder="Ex: 12345-SP"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12" size-sm="6">
          <ion-item class="form-item">
            <ion-input type="date" label="Data de Nascimento" labelPlacement="floating" formControlName="dtNasc"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12" size-sm="6">
          <ion-item class="form-item">
            <ion-input label="Telefone" labelPlacement="floating" formControlName="telefone" placeholder="(00) 00000-0000"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <ion-item class="form-item">
            <ion-select label="Especialidades Médicas" labelPlacement="floating" formControlName="especialidades" multiple="true" placeholder="Selecione as especialidades">
              @for (esp of listaEspecialidades; track esp.id) {
                <ion-select-option [value]="esp.id">{{ esp.nome }}</ion-select-option>
              }
            </ion-select>
          </ion-item>
        </ion-col>

        <ion-col size="12">
          <ion-item class="form-item">
            <ion-textarea label="Observações" labelPlacement="floating" formControlName="observacao" rows="2" placeholder="Informações adicionais do profissional..."></ion-textarea>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="ion-padding-top">
      <ion-button expand="block" type="submit" color="primary" [disabled]="form.invalid || salvando">
        <ion-icon slot="start" [name]="salvando ? 'hourglass-outline' : 'save-outline'"></ion-icon>
        {{ salvando ? 'Salvando...' : 'Salvar Médico' }}
      </ion-button>
    </div>
  </form>
</ion-content>
