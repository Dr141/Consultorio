<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Novo Usuário</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon slot="start" name="close-outline"></ion-icon>
        Fechar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if(erro.length > 0){
    <div class="alert-erro">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <p>{{erro}}</p>
    </div>
  }

  <form [formGroup]="cadastro" (ngSubmit)="confirm()">
    <ion-list lines="none">
      <ion-item class="form-item">
        <ion-input type="email" label="E-mail" labelPlacement="floating" placeholder="usuario@email.com" formControlName="email"
                   helperText="E-mail que será usado no login"
                   error-text="Informe um e-mail válido">
        </ion-input>
      </ion-item>

      <ion-item class="form-item">
        <ion-input type="password" label="Senha" labelPlacement="floating" placeholder="Senha inicial" formControlName="senha"
                   helperText="Mínimo 6 caracteres"
                   error-text="Senha inválida">
          <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
        </ion-input>
      </ion-item>

      <ion-item class="form-item">
        <ion-input type="password" label="Confirmar Senha" labelPlacement="floating" placeholder="Repita a senha" formControlName="confirmarSenha"
                   helperText="Repita a senha"
                   error-text="As senhas digitadas não coincidem">
          <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
    </ion-list>

    <div class="ion-padding-top">
      <ion-button type="submit" expand="block" color="primary" [disabled]="!cadastro.valid">
        <ion-icon slot="start" name="person-add-outline"></ion-icon>
        Cadastrar Usuário
      </ion-button>
    </div>
  </form>
</ion-content>
