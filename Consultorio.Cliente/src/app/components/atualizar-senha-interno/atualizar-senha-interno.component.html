<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Alterar Senha do Usuário</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon slot="start" name="close-outline"></ion-icon>
        Fechar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="cadastro" (ngSubmit)="confirm()">
    <ion-list lines="none">
      <ion-item class="form-item">
        <ion-input type="email" label="E-mail" labelPlacement="floating" formControlName="email" readonly="true">
        </ion-input>
      </ion-item>

      <ion-item class="form-item">
        <ion-input type="password" label="Nova Senha" labelPlacement="floating" formControlName="senha"
                   helperText="Mínimo 6 caracteres"
                   error-text="Senha inválida">
          <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
        </ion-input>
      </ion-item>

      <ion-item class="form-item">
        <ion-input type="password" label="Confirmar Senha" labelPlacement="floating" formControlName="confirmarSenha"
                   helperText="Repita a nova senha"
                   error-text="As senhas digitadas não coincidem">
          <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
    </ion-list>

    <div class="ion-padding-top">
      <ion-button type="submit" expand="block" color="primary" [disabled]="!cadastro.valid">
        <ion-icon slot="start" name="key-outline"></ion-icon>
        Atualizar Senha
      </ion-button>
    </div>
  </form>
</ion-content>
