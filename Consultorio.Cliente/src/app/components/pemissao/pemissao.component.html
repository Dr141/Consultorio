<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Permissões (Roles)</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">
        <ion-icon slot="start" name="close-outline"></ion-icon>
        Fechar
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="permissao" (ngSubmit)="confirm()">
    <ion-list lines="none">
      <ion-item class="form-item">
        <ion-input type="email" label="E-mail" labelPlacement="floating" formControlName="email" readonly="true">
        </ion-input>
      </ion-item>

      <ion-item class="form-item">
        <ion-select label="Atribuir Nova Permissão" label-placement="floating" formControlName="role" placeholder="Selecione">
          @for (role of roles; track role) {
            <ion-select-option [value]="role">{{ role }}</ion-select-option>
          }
        </ion-select>
      </ion-item>
    </ion-list>

    <div class="ion-padding-top ion-padding-bottom">
      <ion-button type="submit" expand="block" color="secondary" [disabled]="!permissao.valid">
        <ion-icon slot="start" name="shield-checkmark-outline"></ion-icon>
        Adicionar Permissão
      </ion-button>
    </div>
  </form>

  <div class="roles-section">
    <h4 class="roles-title">Permissões Atuais do Usuário</h4>
    <ion-list lines="inset">
      @for (role of user.roles; track role) {
        <ion-item class="role-item">
          <ion-icon slot="start" name="shield-outline" color="primary"></ion-icon>
          <ion-label>
            <h3>{{ role }}</h3>
          </ion-label>
          <ion-button slot="end" fill="clear" color="danger" (click)="remover(role)" aria-label="Remover permissão">
            <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
          </ion-button>
        </ion-item>
      } @empty {
        <ion-item lines="none">
          <ion-label color="medium" class="ion-text-center">
            Nenhuma permissão especial vinculada.
          </ion-label>
        </ion-item>
      }
    </ion-list>
  </div>
</ion-content>
