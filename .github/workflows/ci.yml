name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10 + Angular 22)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 💻 Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🟩 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'Consultorio.Cliente/package-lock.json'

      - name: 📦 Restaurar Dependências .NET
        run: dotnet restore Consultorio.sln

      - name: 🧪 Executar Testes Backend (.NET 10 / xUnit)
        run: dotnet test Consultorio.sln --configuration Release --no-restore --verbosity normal

      - name: 📦 Instalar Dependências Frontend (Angular 22)
        working-directory: Consultorio.Cliente
        run: npm ci --legacy-peer-deps

      - name: 🧪 Executar Testes Frontend (Karma / ChromeHeadless)
        working-directory: Consultorio.Cliente
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: 🔨 Compilar Frontend Angular (Produção)
        working-directory: Consultorio.Cliente
        run: npm run build

      - name: 🔨 Compilar Backend Server
        run: dotnet build Consultorio.Server/Consultorio.Server.csproj -c Release --no-restore

  e2e-cypress:
    name: E2E Tests (Cypress)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🟩 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: 🐳 Subir Ambiente com Docker Compose
        run: |
          docker compose up -d --build
          for i in {1..30}; do
            if curl -sSf http://localhost:8080 > /dev/null; then
              echo "Servidor pronto!"
              break
            fi
            sleep 2
          done

      - name: 📦 Instalar Dependências E2E (Cypress)
        working-directory: Consultorio.E2E
        run: |
          npm install
          npx cypress install

      - name: 🧪 Executar Suíte E2E (Cypress Headless)
        working-directory: Consultorio.E2E
        run: npm run cy:run:headless
